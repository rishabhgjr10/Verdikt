# Render's free tier sleeps after 15 minutes without traffic, and the first visitor then waits ~20 s.
# Pinging the health endpoint every 10 minutes keeps it awake (one always-on service fits the free 750 h/month).
# shortcut: GitHub runs schedules on a best-effort basis (delays of a few minutes happen) and pauses them after
# 60 days without repository activity; switch to an external uptime monitor if that matters.
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 120 --retry 2 https://verdikt-aegh.onrender.com/api/health -o /dev/null

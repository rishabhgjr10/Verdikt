spring:
  application:
    name: verdikt-api

  datasource:
    # Priority: SPRING_DATASOURCE_URL (must use jdbc:mysql:// prefix) -> individual DB_* vars
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:verdikt_db}?sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      # -1 means Hikari will keep retrying to get a connection on startup
      # instead of failing immediately if the DB is slow to wake up
      initialization-fail-timeout: -1
      connection-test-query: SELECT 1
      keepalive-time: 60000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        # Retry DDL connection attempts before giving up
        hbm2ddl:
          jdbc_metadata_extraction_strategy: individually

server:
  port: ${PORT:8080}

verdikt:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  integrations:
    tmdb:
      api-key: ${TMDB_API_KEY:}
      base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
    igdb:
      client-id: ${IGDB_CLIENT_ID:}
      client-secret: ${IGDB_CLIENT_SECRET:}
      base-url: ${IGDB_BASE_URL:https://api.igdb.com/v4}
    google-books:
      api-key: ${GOOGLE_BOOKS_API_KEY:}
      base-url: ${GOOGLE_BOOKS_BASE_URL:https://www.googleapis.com/books/v1}

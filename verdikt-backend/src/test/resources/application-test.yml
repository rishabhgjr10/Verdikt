# Integration-test profile: isolated in-memory DB and no real provider calls.
spring:
  datasource:
    url: jdbc:h2:mem:verdikt_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

verdikt:
  integrations:
    tmdb:
      api-key: ""
      base-url: http://127.0.0.1:9
    igdb:
      client-id: ""
      client-secret: ""
      base-url: http://127.0.0.1:9
    google-books:
      api-key: ""
      base-url: http://127.0.0.1:9
    omdb:
      api-key: ""
      base-url: http://127.0.0.1:9
    rawg:
      api-key: ""
      base-url: http://127.0.0.1:9
    anilist:
      base-url: http://127.0.0.1:9
    openlibrary:
      base-url: http://127.0.0.1:9
